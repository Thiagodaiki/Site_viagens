{% extends 'base.html' %}

{% block title %}Cadastro - Perfil de Viagens{% endblock %}

{% block content %}
<h2>Criar Conta</h2>

<form method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
    </div>

    <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" placeholder="Escolha um usuário" required>
    </div>
    
    <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
    </div>

    <div class="form-group">
        <label for="confirm_password">Confirmar Senha</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita sua senha" required>
    </div>
    
    <button type="submit" class="btn">Cadastrar</button>
</form>

<p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
    Já tem uma conta? <a href="{{ url_for('auth.login') }}" style="color: #0d47a1; font-weight: bold;">Faça Login</a>
</p>
{% endblock %}
