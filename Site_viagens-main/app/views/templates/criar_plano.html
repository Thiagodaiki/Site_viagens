{% extends 'base.html' %}

{% block title %}Criar Plano de Viagem{% endblock %}

{% block content %}
<h2>Planejar Nova Viagem</h2>

<form method="POST" action="{{ url_for('plano.criar_plano') }}">
    <div class="form-group">
        <label for="continente">Escolha o Continente:</label>
        <select id="continente" name="continente" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem;">
            <option value="" disabled selected>Selecione um continente...</option>
            <option value="Europa">Europa</option>
            <option value="América Latina">América Latina</option>
            <option value="América do Norte">América do Norte</option>
            <option value="Ásia">Ásia</option>
            <option value="Oceania">Oceania</option>
        </select>
    </div>

    <div class="form-group">
        <label for="pais">Digite o País de Destino:</label>
        <input type="text" id="pais" name="pais" placeholder="Ex: França, Japão, Argentina..." required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; box-sizing: border-box;">
    </div>

    <div class="form-group">
        <label for="apartamento">Escolha a Opção de Hospedagem:</label>
        <select id="apartamento" name="apartamento" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem;">
            <option value="" disabled selected>Selecione um apartamento...</option>
            <option value="Apartamento Conforto Central (Opção 1)">Apartamento Conforto Central (Opção 1)</option>
            <option value="Studio Moderno Vista Panorâmica (Opção 2)">Studio Moderno Vista Panorâmica (Opção 2)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="descricao">Descrição da Viagem:</label>
        <textarea id="descricao" name="descricao" rows="4" placeholder="Ex: Viagem de 15 dias visitando pontos turísticos..." required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; font-family: inherit; margin-bottom: 1rem; box-sizing: border-box;"></textarea>
    </div>
    
    <button type="submit" class="btn">Salvar Plano</button>
</form>

<p style="text-align: center; margin-top: 1rem;">
    <a href="{{ url_for('auth.dashboard') }}" style="color: #0d47a1; font-weight: bold; text-decoration: none;">Voltar ao Dashboard</a>
</p>
{% endblock %}
