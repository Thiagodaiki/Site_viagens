{% extends 'base.html' %}

{% block title %}Criar Pacote de Viagem{% endblock %}

{% block content %}
<div class="form-box">

<h2>Publicar Novo Pacote de Viagem</h2>

<form method="POST" action="{{ url_for('pacote.criar_pacote') }}">
    <div class="form-group">
        <label for="titulo">Título do Pacote:</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Roteiro Completo pela Itália" required>
    </div>

    <div class="form-group">
        <label for="destino">Destino Principal:</label>
        <input type="text" id="destino" name="destino" placeholder="Ex: Roma e Florença, Itália" required>
    </div>

    <div class="form-group">
        <label for="duracao_dias">Duração (em dias):</label>
        <input type="number" id="duracao_dias" name="duracao_dias" min="1" placeholder="Ex: 10" required>
    </div>

    <div class="form-group">
        <label for="preco">Valor Estimado (R$):</label>
        <input type="number" step="0.01" id="preco" name="preco" min="0" placeholder="Ex: 5500.00" required>
    </div>

    <div class="form-group">
        <label for="descricao">O que está incluso / Roteiro:</label>
        <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva passeios, dicas e hospedagem..." required></textarea>
    </div>
    
    <button type="submit" class="btn">Publicar Pacote</button>
</form>

<p style="text-align: center; margin-top: 1rem;">
    <a href="{{ url_for('plano.dashboard') }}" style="color: #0d47a1; font-weight: bold; text-decoration: none;">Voltar ao Dashboard</a>
</p>
</div>
{% endblock %}
